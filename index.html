<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gaia Quiz Website</title>
</head>
<body>

    <!-- Buttons for navigation and testing-->
     <div class="quiz-container">

    <h1>GAIA Environmental Quiz</h1>


    <!--Image on start screen-->
      <div class="image-placeholder">
          <img src="img/earthglobe.png" alt="Earth Globe" class="earth-logo">
      </div>

    <!-- START BUTTON -->
    <button id="startBtn">START QUIZ</button>

    <!-- QUIZ AREA -->
    <div id="quiz" style="display:none;">

      <h2 id="question"></h2>

      <button class="option-btn"></button>
      <button class="option-btn"></button>
      <button class="option-btn"></button>

      <!-- FEEDBACK AREA -->
      <div id="feedback" class="feedback"></div>

    </div>

    <!-- RESULT AREA -->
    <div id="result" style="display:none;"></div>

    <!-- RESET BUTTON -->
    <button id="resetBtn" style="display:none;">TAKE QUIZ AGAIN</button>

    </div>

<script src="script.js"></script>
</body>
</html>
